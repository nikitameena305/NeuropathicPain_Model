name: tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Compile NMODL mechanisms
        run: CC="gcc -std=gnu17" nrnivmodl mods

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check all dry-run modes
        run: |
          python -m sdh_exc.run --dry-run --mode exemplar
          python -m sdh_exc.run --dry-run --mode smoke
          python -m sdh_exc.run --dry-run --mode production

      - name: Run six-cell exemplar
        run: python -m sdh_exc.run --run --mode exemplar --output-dir /tmp/sdh-exc-ci
